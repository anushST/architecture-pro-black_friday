services:
  # APP
  pymongo_api:
    container_name: pymongo_api
    build: 
      context: api_app
      dockerfile: Dockerfile
    depends_on:
      - mongos
    ports:
      - 8080:8080
    networks: [ backend ]
    environment:
      MONGODB_URL: "mongodb://mongos:27020"
      MONGODB_DATABASE_NAME: "somedb"

  # CONFIG SERVERS
  cfg:
    image: dh-mirror.gitverse.ru/mongo:latest
    container_name: cfg
    command: [
      "mongod",
      "--configsvr",
      "--replSet", "config_rs",
      "--bind_ip_all",
      "--port", "27017"
    ]
    volumes:
      - cfg-data:/data/db
    networks: [ backend ]

  # SHARD 1
  shard1:
    image: dh-mirror.gitverse.ru/mongo:latest
    container_name: shard1
    command: [
      "mongod",
      "--shardsvr",
      "--replSet", "shard1_rs",
      "--bind_ip_all",
      "--port", "27018"
    ]
    volumes:
      - shard1-data:/data/db
    networks: [ backend ]

  # SHARD 2
  shard2:
    image: dh-mirror.gitverse.ru/mongo:latest
    container_name: shard2
    command: [
      "mongod",
      "--shardsvr",
      "--replSet", "shard2_rs",
      "--bind_ip_all",
      "--port", "27019"
    ]
    volumes:
      - shard2-data:/data/db
    networks: [ backend ]

  # MONGOS ROUTER
  mongos:
    image: dh-mirror.gitverse.ru/mongo:latest
    container_name: mongos
    command: [
      "mongos",
      "--configdb",
      "config_rs/cfg:27017",
      "--bind_ip_all",
      "--port", "27020"
    ]
    ports:
      - "27020:27020"
    networks: [ backend ]

networks:
  backend:
    driver: bridge

volumes:
  cfg-data:
  shard1-data:
  shard2-data:
